[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calikit"
version = "0.1.0"
description = "Calibration auditing for probabilistic predictions: reliability diagrams, ECE, Brier decomposition, and temperature scaling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hadi Mohammadi" }]
keywords = ["calibration", "reliability", "evaluation", "llm", "machine-learning", "brier"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/mohammadi-hadi/calikit"
Explorer = "https://mohammadi.cv/calikit/"
DOI = "https://doi.org/10.5281/zenodo.21808288"

[project.scripts]
calikit = "calikit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["calikit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Malformed input data raises ValueError on purpose: the CLI catches it and
# turns it into a friendly `error:` message with exit code 2.
ignore = ["TRY004"]
